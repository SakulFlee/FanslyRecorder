name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORGEJO_TOKEN: ${{ forgejo.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build binary
        run: |
          apt-get update && apt-get install -y curl jq binutils
          pip install pyinstaller playwright
          pyinstaller --onefile --name fansly-recorder src/fansly_recorder/__main__.py
      - name: Create release and upload asset
        run: |
          OWNER="${FORGEJO_REPOSITORY%/*}"; REPO="${FORGEJO_REPOSITORY#*/}"
          TAG="${{ forgejo.ref_name }}"; SHA="${{ forgejo.sha }}"; RUN="${{ forgejo.run_number }}"
          RELEASE_JSON=$(curl -s -X POST \
            "https://forgejo.sakul-flee.de/api/v1/repos/${OWNER}/${REPO}/releases" \
            -H "accept: application/json" -H "Authorization: Bearer $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"target_commitish\":\"${SHA}\",\"name\":\"Release ${TAG}\",\"body\":\"Automatic release from Forgejo Actions run #${RUN}\",\"draft\":false,\"prerelease\":false}")
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          curl -X POST \
            "https://forgejo.sakul-flee.de/api/v1/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/assets" \
            -H "Authorization: Bearer $FORGEJO_TOKEN" -F "attachment=@dist/fansly-recorder"
