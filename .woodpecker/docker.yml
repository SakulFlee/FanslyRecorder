when:
  event: [tag, manual]
  branch: main

steps:
  build-and-push:
    image: nixos/nix:latest
    commands:
      - df -h
      - nix store gc --extra-experimental-features 'nix-command flakes'
      - nix build .#dockerImage --accept-flake-config --fallback --extra-experimental-features 'nix-command flakes'
      - df -h
      - mkdir -p /etc/containers && echo '{"default":[{"type":"insecureAcceptAnything"}]}' > /etc/containers/policy.json
      - "echo TOKEN set: $(test -n \"$FORGEJO_TOKEN\" && echo yes || echo no)"
      - nix shell nixpkgs#skopeo --extra-experimental-features 'nix-command flakes' -c skopeo copy docker-archive:result docker://forgejo.sakul-flee.de/sakulflee/fansly-recorder:${CI_COMMIT_TAG:-latest} --dest-creds="$FORGEJO_USER:$FORGEJO_TOKEN"
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
