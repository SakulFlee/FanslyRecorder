when:
  event: [tag, manual]
  branch: main

steps:
  build-and-push:
    image: nixos/nix:latest
    commands:
      - df -h
      - nix store gc --extra-experimental-features 'nix-command flakes'
      - nix build .#dockerImage --accept-flake-config --fallback --extra-experimental-features 'nix-command flakes'
      - df -h
      - mkdir -p /etc/containers && echo '{"default":[{"type":"insecureAcceptAnything"}]}' > /etc/containers/policy.json
      - "echo TOKEN length: ${#FORGEJO_TOKEN}"
      - "echo USER: $FORGEJO_USER"
      - "if [ -z \"$FORGEJO_TOKEN\" ]; then echo 'FORGEJO_TOKEN is empty or unset'; else echo 'FORGEJO_TOKEN is set'; fi"
      - "if [ \"${FORGEJO_TOKEN+set}\" = set ]; then echo 'FORGEJO_TOKEN is actually set (not unset)'; else echo 'FORGEJO_TOKEN is truly unset'; fi"
      - nix shell nixpkgs#skopeo --extra-experimental-features 'nix-command flakes' -c skopeo copy docker-archive:result docker://forgejo.sakul-flee.de/sakulflee/fansly-recorder:${CI_COMMIT_TAG:-latest} --dest-registry-token="$FORGEJO_TOKEN"
    environment:
      FORGEJO_USER:
        from_secret: FORGEJO_USER
      FORGEJO_TOKEN:
        from_secret: FORGEJO_TOKEN
