when:
  event: [tag, manual]
  branch: main

steps:
  build-and-push:
    image: nixos/nix:latest
    commands:
      - nix store gc --extra-experimental-features 'nix-command flakes'
      - nix build .#dockerImage --accept-flake-config --fallback --extra-experimental-features 'nix-command flakes'
      - mkdir -p /etc/containers && echo '{"default":[{"type":"insecureAcceptAnything"}]}' > /etc/containers/policy.json
      - nix shell nixpkgs#podman --extra-experimental-features 'nix-command flakes' -c sh -c '
          IMG=$(podman load -i result | sed "s/^Loaded image: //")
          podman push --creds "$FORGEJO_USER:$FORGEJO_TOKEN" "$IMG" docker://forgejo.sakul-flee.de/sakulflee/fansly-recorder:${CI_COMMIT_TAG:-latest}
        '
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
